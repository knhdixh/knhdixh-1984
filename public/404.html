<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 1984</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --fg: #000; --muted: #8a8a8a; --bg: #fff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 400 15px/1.6 "Inter", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 20vh 24px 80px; }
  h1 { font-size: clamp(56px, 13vw, 112px); font-weight: 500; letter-spacing: -0.055em; line-height: .9; margin: 0 0 48px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--fg); font-weight: 500; }
  a:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }
  @media (max-width: 480px) { main { padding-top: 16vh; } }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Nothing here.</p>
  <a href="/">Back</a>
